name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: bash scripts/lint_nut.sh
      - run: python3 scripts/gen_fixtures.py --check
      - name: pack smoke test
        run: |
          cargo run --locked -p l4d2api-pack -- \
            --addon addon \
            --out dist/tiktools-l4d2api-0.1.0.vpk \
            --version 0.1.0
          sha256sum dist/tiktools-l4d2api-0.1.0.vpk
