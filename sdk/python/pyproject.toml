[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l4d2api"
version = "0.1.0"
description = "File-IPC client SDK for the L4D2api game addon (no HTTP, no server)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = []
